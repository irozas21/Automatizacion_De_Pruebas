name: Deployment Pipeline - Acceptance Tests y Rollback

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven

    - name: Dar permisos de ejecución al script
      run: chmod +x deploy/deploy.sh

    - name: Ejecutar Deployment Pipeline (Build + Deploy + Acceptance Tests)
      run: ./deploy/deploy.sh

    - name: Simular Rollback
      if: failure()
      run: |
        echo "ROLLBACK ACTIVADO: Restaurando ambiente anterior..."
        rm -rf /tmp/ambiente-pruebas
        echo "ROLLBACK completado exitosamente."
